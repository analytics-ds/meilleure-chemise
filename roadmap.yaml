# Roadmap editoriale - meilleure-chemise.com
#
# FICHIER UNIQUE. Il remplace l'ancien couple roadmap.yaml + roadmap-informationnelle.yaml,
# fusionnes le 2026-09-24. La routine ne lit QUE ce fichier.
#
# ROUTINE ASSOCIEE : "meilleure-chemise-1-article-semaine"
#   cron 0 6 * * 3 (tous les mercredis, 06:00 UTC). 1 declenchement = 1 article FR+EN.
#
# REGLE DE SELECTION, prioritaire sur tout le reste
#   La routine publie la PREMIERE entree du fichier dont status vaut todo, dans l'ordre
#   d'apparition. Elle n'improvise jamais un sujet, elle ne choisit jamais la categorie
#   la moins fournie. scheduled_date est indicatif : si une semaine saute, l'ordre du
#   fichier fait foi, pas la date. Si toutes les entrees sont done, la routine s'arrete
#   sans rien publier et le signale.
#
# ORDRE VOULU
#   Les 20 premieres entrees sont les sujets piliers et les tetes de silo. Les suivantes
#   sont la couverture informationnelle exhaustive de la thematique chemise.
#
# SILO "COL DE CHEMISE"
#   "types de col de chemise" est le PILIER du silo col : hub de maillage, les entrees col
#   italien, col boutonne, col mao et col cutaway lient vers lui sans le dupliquer.
#
# CLIENT Cafe Coton, regles issues de son Obsidian
#   Aucune fiche produit Cafe Coton (0 sur 70 verifiees le 2026-09-23) ne revendique
#   "sans repassage" : l'article sur ce sujet ne pose AUCUN lien vers le client.
#   Sur les sujets repassage, la page a citer est
#   https://www.cafecoton.com/fr/comment-repasser-sa-chemise-cafe-coton-4 (position 7,3).
#   Vocabulaire impose : popeline, oxford, jersey, gaze de coton, tencel, lin, coton ;
#   slim, classique, grandes longueurs de manche ; col boutonne, col mao, petit col, gorge
#   cachee, poignets mousquetaires ; business, casual, luxe, mariage. La marque s'ecrit
#   toujours "Cafe Coton", avec l'accent et en deux mots.
#   Chaque article peut citer UNE page reelle de cafecoton.com, verifiee en HTTP 200 avant
#   citation, et seulement si elle a un sens direct pour le sujet exact de l'article.
#
# ANTI-CANNIBALISATION RESEAU
#   "meilleure marque de chemise homme" est volontairement ABSENT : le sujet est tenu par
#   comparatif-mode (Manon Lamache). A arbitrer avec elle avant tout ajout ici.
#
# SOURCE de la couverture informationnelle
#   bonnegueule.fr, top blog francais du vetement homme : pages les mieux positionnees
#   relevees via Haloscan le 2026-09-23, converties en sujets et dedupliquees.
#
# volume : volume mensuel Haloscan releve les 2026-09-23 et 2026-09-24. null = aucune donnee
#          remontee, ce n'est PAS un volume nul. Sur la chemise, le volume mesurable est
#          transactionnel : la couche informationnelle se justifie par la valeur de citation
#          dans les moteurs IA, pas par le clic organique.
# kd     : KVI Haloscan quand il existe, un indice de valeur, pas une difficulte. null sinon.

