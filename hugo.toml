baseURL = "https://meilleure-chemise.com"
title = "Meilleure Chemise"
theme = "meilleure-chemise-theme"
removePathAccents = true

defaultContentLanguage = "fr"
defaultContentLanguageInSubdir = false

[languages]
  [languages.fr]
    languageCode = "fr-FR"
    languageName = "Français"
    weight = 1
    title = "Meilleure Chemise"
    contentDir = "content"
    [languages.fr.taxonomies]
      category = "categories"
      tag = "tags"
    [languages.fr.params]
      description = "Le guide indépendant pour choisir, porter et entretenir sa chemise homme et femme : matières, coupes, occasions et entretien."

  [languages.en]
    languageCode = "en-US"
    languageName = "English"
    weight = 2
    title = "Meilleure Chemise"
    contentDir = "content-en"
    [languages.en.taxonomies]
      category = "categories"
      tag = "tags"
    [languages.en.params]
      description = "The independent guide to choosing, wearing and caring for men's and women's shirts: fabrics, cuts, occasions and care."

[[languages.fr.menus.main]]
  name = "Accueil"
  url = "/"
  weight = 1
[[languages.fr.menus.main]]
  name = "Matières et tissus"
  url = "/categories/matieres-et-tissus/"
  weight = 2
[[languages.fr.menus.main]]
  name = "Coupes et style"
  url = "/categories/coupes-et-style/"
  weight = 3
[[languages.fr.menus.main]]
  name = "Occasions et dress code"
  url = "/categories/occasions-et-dress-code/"
  weight = 4
[[languages.fr.menus.main]]
  name = "Entretien et durabilité"
  url = "/categories/entretien-et-durabilite/"
  weight = 5
[[languages.fr.menus.main]]
  name = "Le Blog"
  url = "/blog/"
  weight = 99

[[languages.en.menus.main]]
  name = "Home"
  url = "/en/"
  weight = 1
[[languages.en.menus.main]]
  name = "Fabrics and Materials"
  url = "/en/categories/fabrics-and-materials/"
  weight = 2
[[languages.en.menus.main]]
  name = "Cuts and Styles"
  url = "/en/categories/cuts-and-styles/"
  weight = 3
[[languages.en.menus.main]]
  name = "Occasions and Dress Code"
  url = "/en/categories/occasions-and-dress-code/"
  weight = 4
[[languages.en.menus.main]]
  name = "Care and Durability"
  url = "/en/categories/care-and-durability/"
  weight = 5
[[languages.en.menus.main]]
  name = "The Blog"
  url = "/en/blog/"
  weight = 99

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ['html', 'rss']
  section = ['html', 'rss']

[params]
  author_name = "Magalie Ergoz"
  author_url = ""
  author_job_title = "Blogueuse mode & beauté"
  default_og_image = "/images/logo-full.png"
  logo = "/images/logo.png"
  founding_year = "2026"
  expertise = ["Chemise homme et femme", "Matières textiles", "Style et dress code", "Entretien textile"]

[related]
  includeNewer = true
  threshold = 80
  [[related.indices]]
    name = "categories"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = true
  [markup.goldmark.renderer]
    unsafe = true
